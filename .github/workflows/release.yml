name: Release

# A tag like v0.2.0 builds every platform into one draft release. Publishing
# the draft is a person's click, after trying a download or two: nothing
# reaches anyone unseen. See docs/release.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # A tag that disagrees with the files would ship a mislabelled build.
      - name: The tag matches the version
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"

      - id: notes
        name: Release notes from CHANGELOG.md
        run: |
          {
            echo 'body<<NOTES_EOF'
            node scripts/version.mjs --notes "${GITHUB_REF_NAME#v}"
            echo
            echo '---'
            echo 'First launch on macOS and Windows asks once, because Lurkn is not signed:'
            echo 'see [Installing](https://github.com/${{ github.repository }}#installing).'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: an AppImage runs on systems at least as
          # new as the one it was built on.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # One download for every Mac, Apple Silicon and Intel.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux WebView dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev patchelf build-essential

      # Honours rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable

      # Added inside the repository, so they land on the pinned toolchain
      # rather than on whatever `stable` the step above installed.
      - name: Both Mac architectures
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: release

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri.release.conf.json switches on the signed update files, which need
      # the private key; a build from source leaves them out and needs no key.
      # The action merges each build's entry into the release's latest.json,
      # which the updater reads (docs/architecture.md §14.1).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lurkn ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  # The three builds write latest.json one after another and can overwrite each
  # other's entry. A platform missing from it would never be offered the
  # update, or — worse — fall back to a file meant for another bundle, so the
  # draft is checked before anyone publishes it. Re-running the failed build
  # job puts its entry back.
  updater:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: latest.json names every platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json -D "$RUNNER_TEMP"
          for platform in linux-x86_64-appimage windows-x86_64-nsis darwin-aarch64-app darwin-x86_64-app; do
            if ! jq -e --arg p "$platform" '.platforms[$p] | .url and .signature' \
                "$RUNNER_TEMP/latest.json" > /dev/null; then
              echo "::error::latest.json has no $platform entry"
              exit 1
            fi
          done
          jq '.platforms | keys' "$RUNNER_TEMP/latest.json"
