# What the dependency tree may contain. `cargo deny check` runs in CI.

[graph]
# Every platform Lurkn ships for, so a crate pulled in only on Windows or macOS
# is checked as well.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# RustSec advisories. An unmaintained crate is flagged only when Lurkn depends
# on it directly; deep in Tauri's tree it is Tauri's to replace.
unmaintained = "workspace"
ignore = []

[licenses]
# Licenses that allow shipping their code inside an MIT-licensed app, provided
# the notices travel with it (THIRD_PARTY_LICENSES.md).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Tauri's tree carries several versions of some crates; unifying them is not
# Lurkn's to do.
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates point at each other by path, with no version;
# they are unpublished, so that is fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
