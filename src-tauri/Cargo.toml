[package]
name = "lurkn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A focused Twitch client for following, chat and emotes"

[lib]
# Tauri 2 mobile targets require a lib; desktop uses it too so main.rs stays tiny.
name = "lurkn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lurkn-core.workspace = true
lurkn-auth.workspace = true
lurkn-twitch.workspace = true
lurkn-chat.workspace = true
lurkn-emotes.workspace = true
lurkn-browser.workspace = true
lurkn-store.workspace = true
lurkn-watch.workspace = true

async-trait.workspace = true
dirs.workspace = true
# "fontconfig" is what makes load_system_fonts honour the user's font
# configuration on Linux rather than only scanning the standard directories.
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap", "fontconfig"] }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true

[lints]
workspace = true
